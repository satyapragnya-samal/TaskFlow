{% extends 'base.html' %}
{% block title %}Access Denied — 403 Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <i class="bi bi-shield-x display-1 text-danger"></i>
        <h1 class="display-5 fw-bold mt-3">403 Forbidden</h1>
        <p class="lead text-muted">You do not have permission to view this resource.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-2">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
